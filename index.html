<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenAnchor | Campagne Ambientali</title>
    <meta
      name="description"
      content="Scopri e firma campagne ambientali gratuite da fonti affidabili europee e globali."
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Space Grotesk"', 'sans-serif'],
              body: ['"IBM Plex Sans"', 'sans-serif']
            },
            boxShadow: {
              halo: '0 0 0 1px rgba(15, 23, 42, 0.08), 0 16px 40px rgba(22, 163, 74, 0.20)'
            },
            keyframes: {
              fadeUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' }
              }
            },
            animation: {
              fadeUp: 'fadeUp 0.5s ease-out both'
            }
          }
        }
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script defer src="app.js"></script>
  </head>
  <body class="font-body text-slate-900 antialiased">
    <div class="page-bg"></div>

    <main class="relative z-10 mx-auto max-w-6xl px-4 pb-20 pt-10 sm:px-8">
      <header class="mb-10 rounded-3xl border border-white/70 bg-white/70 p-7 shadow-halo backdrop-blur">
        <p class="mb-3 inline-block rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-emerald-900">
          GreenAnchor
        </p>
        <h1 class="font-display text-4xl leading-tight text-slate-900 sm:text-5xl">
          Trova campagne ambientali
          <span class="text-emerald-700">attive e verificabili</span>
        </h1>
        <p class="mt-4 max-w-2xl text-slate-700">
          Aggregatore gratuito con priorita Italia: dati da fonti italiane ed europee, piu reti globali.
          Ricerca istantanea nel browser, senza backend e senza costi piattaforma.
        </p>
      </header>

      <section class="mb-6 grid gap-4 rounded-3xl border border-emerald-100 bg-white/80 p-5 shadow-halo backdrop-blur md:grid-cols-3">
        <label class="md:col-span-2">
          <span class="mb-2 block text-sm font-semibold text-slate-700">Cerca per titolo, tema o organizzazione</span>
          <input
            id="searchInput"
            type="search"
            placeholder="es. plastica, foreste, oceani"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-emerald-600 focus:ring-2 focus:ring-emerald-200"
          />
        </label>

        <label>
          <span class="mb-2 block text-sm font-semibold text-slate-700">Fonte</span>
          <select
            id="sourceFilter"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-emerald-600 focus:ring-2 focus:ring-emerald-200"
          >
            <option value="all">Tutte le fonti</option>
          </select>
        </label>
      </section>

      <section class="mb-4 flex items-center justify-between">
        <p id="stats" class="text-sm font-medium text-slate-700">Caricamento campagne...</p>
        <p id="updatedAt" class="text-xs text-slate-500"></p>
      </section>

      <section id="results" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></section>

      <template id="campaignCardTemplate">
        <article class="group rounded-2xl border border-emerald-100 bg-white p-5 shadow-halo transition hover:-translate-y-0.5 hover:shadow-lg">
          <p class="text-xs font-semibold uppercase tracking-wide text-emerald-700" data-source></p>
          <h2 class="mt-2 font-display text-xl leading-tight text-slate-900" data-title></h2>
          <p class="mt-3 text-sm text-slate-700" data-summary></p>
          <div class="mt-4 flex flex-wrap gap-2" data-tags></div>
          <a
            data-link
            target="_blank"
            rel="noopener noreferrer"
            class="mt-5 inline-flex items-center gap-2 rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold text-white transition hover:bg-emerald-800"
          >
            Partecipa
            <span aria-hidden="true">-></span>
          </a>
        </article>
      </template>
    </main>
  </body>
</html>
